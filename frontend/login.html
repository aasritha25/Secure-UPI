<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Secure UPI Fraud Detection System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-lg-5">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <div class="brand-logo-icon"><i class="fas fa-shield-halved"></i></div>
        <div>
          <div class="brand-title">Secure UPI</div>
          <div class="brand-subtitle">ML Fraud Detection System</div>
        </div>
      </a>
      <div class="d-flex gap-2">
        <a href="/" class="btn btn-sm btn-outline-secondary"><i class="fas fa-home me-1"></i> Home</a>
        <a href="/register" class="btn btn-sm btn-fin-primary"><i class="fas fa-user-plus me-1"></i> Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- One-Click Demo Credentials Pill Bar -->
        <div class="card border-0 shadow-sm mb-3 bg-white p-3">
          <div class="small fw-bold text-muted text-uppercase mb-2">
            <i class="fas fa-key text-warning me-1"></i> One-Click Demo Credentials:
          </div>
          <div class="d-flex gap-2">
            <button id="fillDemoCustomer" type="button" class="btn btn-sm btn-outline-primary flex-grow-1">
              <i class="fas fa-user me-1"></i> Demo Customer
            </button>
            <button id="fillDemoAdmin" type="button" class="btn btn-sm btn-outline-dark flex-grow-1">
              <i class="fas fa-user-shield me-1"></i> Bank Admin
            </button>
          </div>
        </div>

        <div class="card fin-card shadow-md border-0 p-4 bg-white">
          <div class="text-center mb-4">
            <div class="brand-logo-icon mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.5rem;">
              <i class="fas fa-lock"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Account Sign In</h4>
            <p class="text-muted small">Access your UPI transaction portal and ML security engine</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fas fa-envelope"></i></span>
                <input type="email" id="loginEmail" class="form-control" placeholder="demo@secureupi.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fas fa-lock"></i></span>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-fin-primary w-100 py-2 fw-semibold mb-3">
              <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>

            <div class="text-center text-muted small">
              Don't have an account yet? <a href="/register" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <footer class="footer-custom text-center mt-auto">
    <div class="container small text-muted">
      Secure UPI Academic Project &copy; 2026 | Machine Learning-Driven Fraud Detection
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
